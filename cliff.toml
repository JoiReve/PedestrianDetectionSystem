# git-cliff 配置：从 Conventional Commits 自动生成 CHANGELOG.md
#
# 常用命令
#   git-cliff                              全量重建，打印到 stdout（不落盘，用来预览）
#   git-cliff -o CHANGELOG.md              全量重建并写入文件
#   git-cliff --unreleased --tag v0.2.1    预演"下一个版本"的样子
#   git-cliff --bump                       由提交内容自动推断下一个版本号
#
# 发版流程（四步）
#   1. 改 CMakeLists.txt 的 VERSION，以及 README.md 首屏的 **vx.y.z**（两者必须一致，CI 会校验）
#   2. git-cliff --unreleased --tag v0.2.1 -o CHANGELOG.md
#   3. git add -A && git commit -m "chore(release): v0.2.1"
#   4. git tag v0.2.1 && git push origin main --tags
#
# 注意：chore(release) 提交被下面的 commit_parsers 过滤掉，不会出现在 CHANGELOG 里。

[changelog]
header = """
# 更新记录

本文件由 [git-cliff](https://git-cliff.org/) 从提交历史自动生成，**请勿手工编辑**。
提交信息遵循 [Conventional Commits](https://www.conventionalcommits.org/) 约定。

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**：{% endif %}{{ commit.message | trim }}
{% endfor %}\
{% endfor %}\n
"""
footer = """
"""
trim = true

[git]
conventional_commits = true
# 保留不符合规范的提交（如最初的一次性提交），交给下面的兜底 parser 归入「其他」
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# 按顺序匹配，先命中先归属；group 前缀 <!-- N --> 只用于排序，渲染时被 striptags 去掉
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->✨ 新功能" },
    { message = "^fix", group = "<!-- 1 -->🐛 修复" },
    { message = "^perf", group = "<!-- 2 -->⚡ 性能" },
    { message = "^refactor", group = "<!-- 3 -->♻️ 重构" },
    { message = "^docs", group = "<!-- 4 -->📝 文档" },
    { message = "^test", group = "<!-- 5 -->✅ 测试" },
    { message = "^style", group = "<!-- 6 -->🎨 代码格式" },
    { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ 杂项" },
    { message = ".*", group = "<!-- 8 -->📦 其他" },
]
