name: CI

# 两条独立流水线：
#   build —— 自编译 OpenCV 5.0.0（缓存）+ 项目编译 + 链接来源校验 + DNN 冒烟
#   docs  —— 版本号与文档链接一致性
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一 ref 的多次运行排队执行；新推送到来时，取消该 ref 上尚未完成的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 + 冒烟（自编译 OpenCV 5.0.0）
    # 固定 runner 镜像，与本地验证环境保持一致；ubuntu-latest 自 2026-10-19
    # 起逐步迁移到 Ubuntu 26.04，显式指定可避免镜像切换时复用不兼容的缓存。
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # OpenCV 5.0.0（tag 5.0.0，commit 40738fb）；改动此值会使缓存 key 变化并触发重建
      OPENCV_COMMIT: 40738fb16ceddb5fb3fea747585f7ce6abb0605b
      # 写入缓存 key：切换 runner 镜像时必须同步修改，强制重建 OpenCV
      UBUNTU_VERSION: "26.04"
    steps:
      - uses: actions/checkout@v7

      # 缓存自编译的 OpenCV 安装目录（~/opencv5），避免每次 CI 重编。
      # key 含 Ubuntu 版本与源码 commit，两者任一变化都会触发重建。
      - name: 缓存 OpenCV 安装
        id: cache-opencv
        uses: actions/cache@v6
        with:
          path: ~/opencv5
          key: opencv-${{ runner.os }}-${{ env.UBUNTU_VERSION }}-${{ env.OPENCV_COMMIT }}

      # CMakeLists.txt 要求 OpenCV 5（find_package(OpenCV 5 REQUIRED)），
      # runner 预装的 OpenCV 4.x 不满足要求，因此按固定 commit 自编译 5.0.0。
      - name: 安装 OpenCV 构建依赖
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          # highgui 依赖 GTK3，videoio 依赖 FFmpeg（libav*）
          sudo apt-get install -y --no-install-recommends \
            cmake g++ curl unzip \
            libgtk-3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: 编译并安装 OpenCV 5.0.0
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/opencv.zip \
            "https://github.com/opencv/opencv/archive/${OPENCV_COMMIT}.zip"
          unzip -q /tmp/opencv.zip -d /tmp
          # BUILD_LIST 只编译本项目用到的 6 个模块；测试、示例、Java/Python
          # 绑定全部关闭，显著缩短构建时间。
          cmake -S "/tmp/opencv-${OPENCV_COMMIT}" -B /tmp/opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/opencv5" \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,dnn \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF
          cmake --build /tmp/opencv-build -j"$(nproc)"
          cmake --install /tmp/opencv-build

      # 自编译的 5.0.0 位于 $HOME/opencv5，不在 CMake 默认搜索路径中；
      # 不指定 OpenCV_DIR 时，系统自带 OpenCV 4.x 会被版本检查拒绝。
      - name: 配置本项目
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="$HOME/opencv5/lib/cmake/opencv5"

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      # find_package 只保证编译期选对版本；此步在二进制层面确认动态库确实
      # 来自 $HOME/opencv5，防止链接到系统 OpenCV。
      - name: 确认链接到自编译的 5.0.0
        run: |
          if ! ldd build/pedestrian_detection_system | grep -q "$HOME/opencv5"; then
            echo "::error::二进制未链接到自编译的 OpenCV 5.0.0，CMake 可能找到了系统版本"
            ldd build/pedestrian_detection_system | grep -i opencv || true
            exit 1
          fi

      # CI 环境无摄像头与 GPU，完整检测跑不了；改为验证 DNN 最小链路：
      # 加载 ONNX → 前向推理 → 校验输出张量形状。
      - name: 冒烟测试
        run: ./build/smoke_dnn models/yolov8n.onnx

  # ──────────────────────────────────────────────────────────────────────
  docs:
    name: 文档一致性
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 以 CMakeLists.txt 中的版本号为准，校验 README 首屏与其一致
      - name: 校验版本号
        run: python3 scripts/check_version.py

      # 校验 README 及 docs/ 中的相对路径、页面内锚点（#fragment）、目录覆盖率
      - name: 校验文档链接
        run: python3 scripts/check_links.py
