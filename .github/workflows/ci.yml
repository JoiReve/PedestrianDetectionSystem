name: CI

# 两条独立流水线：
#   build —— 自编译 OpenCV 5.0.0（缓存）+ 项目编译 + 链接来源校验 + DNN 冒烟
#   docs  —— 版本号与文档链接一致性
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一 ref 的多次运行排队执行；新推送到来时，取消该 ref 上尚未完成的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 + 冒烟（自编译 OpenCV 5.0.0）
    # 固定 runner 镜像，避免 ubuntu-latest 迁移带来的系统库/缓存不兼容
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # OpenCV 5.0.0（tag 5.0.0，commit 40738fb）；改动此值会触发缓存重建
      OPENCV_COMMIT: 40738fb16ceddb5fb3fea747585f7ce6abb0605b
      # 缓存 key 的一部分；切换 runner 镜像时必须同步修改
      UBUNTU_VERSION: "24.04"
    steps:
      - uses: actions/checkout@v7

      # 缓存自编译的 OpenCV 安装目录（~/opencv5），避免每次 CI 重编。
      # key 含 Ubuntu 版本、源码 commit 与配置版本号，任一变化都会触发重建。
      - name: 缓存 OpenCV 安装
        id: cache-opencv
        uses: actions/cache@v6
        with:
          path: ~/opencv5
          key: opencv-${{ runner.os }}-${{ env.UBUNTU_VERSION }}-${{ env.OPENCV_COMMIT }}-v2

      # 关键：缓存只保存 ~/opencv5，不包含系统库。无论是否命中缓存，
      # 都必须安装 FFmpeg/GTK 依赖，否则链接缓存中的 libopencv_videoio 时
      # 会因为找不到 libavcodec/libavutil 等实现而失败。
      - name: 安装 OpenCV 构建与运行依赖
        run: |
          sudo apt-get update
          # highgui 依赖 GTK3，videoio 依赖 FFmpeg（libav*）；
          # pkg-config 供 OpenCV 的 detect_ffmpeg.cmake 检测 FFmpeg
          sudo apt-get install -y --no-install-recommends \
            cmake g++ curl unzip pkg-config \
            libgtk-3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          # 刷新动态库缓存（apt 通常会自动触发，这里显式执行以防万一）
          sudo ldconfig

      - name: 编译并安装 OpenCV 5.0.0
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/opencv.zip \
            "https://github.com/opencv/opencv/archive/${OPENCV_COMMIT}.zip"
          unzip -q /tmp/opencv.zip -d /tmp
          # BUILD_LIST 只编译本项目用到的 6 个模块；测试、示例、Java/Python
          # 绑定全部关闭，显著缩短构建时间。
          #
          # FFmpeg 说明：OpenCV 5.0.0 的 videoio/detect_ffmpeg.cmake 通过
          # pkg-config 查找 libavcodec/libavformat/libavutil/libswscale，
          # 不读取 FFMPEG_ROOT，因此不添加该无效参数。
          # 下面的 rpath-link/-L 是防御性配置，正常安装依赖时并非必需。
          cmake -S "/tmp/opencv-${OPENCV_COMMIT}" -B /tmp/opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/opencv5" \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,dnn \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_FFMPEG=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath-link,/usr/lib/x86_64-linux-gnu -L/usr/lib/x86_64-linux-gnu" \
            -DCMAKE_MODULE_LINKER_FLAGS="-Wl,-rpath-link,/usr/lib/x86_64-linux-gnu -L/usr/lib/x86_64-linux-gnu" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,/usr/lib/x86_64-linux-gnu -L/usr/lib/x86_64-linux-gnu"
          cmake --build /tmp/opencv-build -j"$(nproc)"
          cmake --install /tmp/opencv-build

      # 自编译的 5.0.0 位于 $HOME/opencv5，不在 CMake 默认搜索路径中；
      # 不指定 OpenCV_DIR 时，系统自带 OpenCV 4.x 会被版本检查拒绝。
      - name: 配置本项目
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="$HOME/opencv5/lib/cmake/opencv5"

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      # find_package 只保证编译期选对版本；此步在二进制层面确认动态库确实
      # 来自 $HOME/opencv5，防止链接到系统 OpenCV。
      - name: 确认链接到自编译的 5.0.0
        run: |
          if ! ldd build/pedestrian_detection_system | grep -q "$HOME/opencv5"; then
            echo "::error::二进制未链接到自编译的 OpenCV 5.0.0，CMake 可能找到了系统版本"
            ldd build/pedestrian_detection_system | grep -i opencv || true
            exit 1
          fi

      # CI 环境无摄像头与 GPU，完整检测跑不了；改为验证 DNN 最小链路：
      # 加载 ONNX → 前向推理 → 校验输出张量形状。
      - name: 冒烟测试
        run: ./build/smoke_dnn models/yolov8n.onnx

  # ──────────────────────────────────────────────────────────────────────
  docs:
    name: 文档一致性
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 以 CMakeLists.txt 中的版本号为准，校验 README 首屏与其一致
      - name: 校验版本号
        run: python3 scripts/check_version.py

      # 校验 README 及 docs/ 中的相对路径、页面内锚点（#fragment）、目录覆盖率
      - name: 校验文档链接
        run: python3 scripts/check_links.py
