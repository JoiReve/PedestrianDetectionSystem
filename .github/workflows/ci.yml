name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次未跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-distro:
    name: 编译（发行版 OpenCV 4.6 · 非目标版本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build -j"$(nproc)"

  build-opencv5:
    name: 编译 + 冒烟（自编译 OpenCV 5.1 · 目标版本）
    runs-on: ubuntu-latest
    env:
      OPENCV_COMMIT: 8d126c4a672936fde5a21d9133c352b18d4299a5
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 OpenCV 安装
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ~/opencv5
          key: opencv-${{ runner.os }}-${{ env.OPENCV_COMMIT }}

      - name: 从源码构建 OpenCV 5.1
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          # GTK3 供 highgui；ffmpeg 供 videoio（本地那份 OpenCV 也是 FFMPEG: YES）
          sudo apt-get install -y --no-install-recommends \
            cmake g++ curl unzip \
            libgtk-3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          curl -sSL -o /tmp/opencv.zip \
            "https://github.com/opencv/opencv/archive/${OPENCV_COMMIT}.zip"
          unzip -q /tmp/opencv.zip -d /tmp
          cmake -S "/tmp/opencv-${OPENCV_COMMIT}" -B /tmp/opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/opencv5" \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,dnn \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF
          cmake --build /tmp/opencv-build -j"$(nproc)"
          cmake --install /tmp/opencv-build

      - name: 配置本项目
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="$HOME/opencv5/lib/cmake/opencv5"

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      # ubuntu runner 上可能预装了系统 OpenCV，这条防止 CMake 悄悄用了它
      - name: 确认链接到自编译的 5.1
        run: |
          if ! ldd build/pedestrian_detection_system | grep -q "$HOME/opencv5"; then
            echo "::error::二进制未链接到自编译的 OpenCV 5.1，CMake 可能找到了系统版本"
            ldd build/pedestrian_detection_system | grep -i opencv || true
            exit 1
          fi

      - name: 冒烟（ONNX 加载 → 前向推理 → 校验输出形状）
        run: |
          export PKG_CONFIG_PATH="$HOME/opencv5/lib/pkgconfig"
          g++ -std=c++17 -O2 scripts/smoke_dnn.cpp -o /tmp/smoke_dnn \
            $(pkg-config --cflags --libs opencv5)
          /tmp/smoke_dnn models/yolov8n.onnx

  # ──────────────────────────────────────────────────────────────────────
  docs:
    name: 文档一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CMakeLists.txt 是真源，README 首屏必须与之一致
      - name: 校验版本号
        run: python3 scripts/check_version.py

      # 相对路径 + #锚点 + 目录覆盖率
      - name: 校验文档链接
        run: python3 scripts/check_links.py
